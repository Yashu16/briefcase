[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "briefcase"
version = "0.1.0"
description = "Job-intel agent: posting URL or text in, cited research brief out."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.8",
  "openai>=1.50",
  "neatlogs",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "ddgs>=9.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
briefcase = "src.main:cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
